<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{SEALED_CSP}}">
<meta name="referrer" content="no-referrer">
<meta http-equiv="x-dns-prefetch-control" content="off">
<meta name="color-scheme" content="light dark">
<meta name="offlineseal-instance" content="{{INSTANCE_PLACEHOLDER}}">
<title>Private processing area</title>
<style>{{SEALED_STYLE}}</style>
</head>
<body data-state="sealing">
<main class="tool">
  <section class="source" aria-label="Your image">
    <div class="dropzone" id="dropzone">
      <svg class="dz-icon" viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="10" width="34" height="28" rx="4"/><circle cx="18" cy="20" r="3.5"/><path d="M9 34l10-10 7 7 5-5 8 8"/></svg>
      <p class="dz-title" id="dz-title">Preparing…</p>
      <p class="dz-sub" id="dz-sub">Checking the seal before any file can be added.</p>
      <button type="button" class="primary" id="choose" disabled>Choose image</button>
      <input type="file" id="file" disabled hidden>
      <p class="message" id="dz-message" role="alert" hidden></p>
    </div>
    <figure class="preview" id="preview" hidden>
      <div class="canvas-box" id="preview-box"></div>
      <figcaption><strong id="source-name"></strong><span id="source-meta"></span></figcaption>
    </figure>
  </section>

  <section class="settings" id="settings" aria-label="Conversion settings" hidden>
    <div class="field">
      <span class="label" id="format-label">Convert to</span>
      <div class="segmented" id="formats" role="radiogroup" aria-labelledby="format-label"></div>
      <p class="hint" id="format-hint"></p>
    </div>
    <div class="field" id="quality-row">
      <label class="label" for="quality">Quality <output id="quality-value">85%</output></label>
      <input type="range" id="quality" min="10" max="100" step="1" value="85">
    </div>
    <div class="field">
      <span class="label">Size <small>pixels</small></span>
      <div class="dims">
        <input type="number" id="width" min="1" max="16384" inputmode="numeric" aria-label="Width in pixels">
        <span aria-hidden="true">×</span>
        <input type="number" id="height" min="1" max="16384" inputmode="numeric" aria-label="Height in pixels">
      </div>
      <label class="check"><input type="checkbox" id="keep-aspect" checked> Keep proportions</label>
      <div class="scales" id="scales" role="group" aria-label="Quick resize">
        <button type="button" data-scale="100">100%</button>
        <button type="button" data-scale="75">75%</button>
        <button type="button" data-scale="50">50%</button>
        <button type="button" data-scale="25">25%</button>
      </div>
    </div>
    <button type="button" class="primary wide" id="convert" disabled>Convert</button>
    <p class="message" id="message" role="alert" hidden></p>
    <div class="result" id="result" hidden>
      <div class="result-thumb" id="result-thumb"></div>
      <div class="result-text">
        <strong id="result-meta"></strong>
        <span id="result-note"></span>
      </div>
      <a class="primary wide download" id="download">Download</a>
    </div>
    <p class="fineprint">Metadata such as camera details and location is not copied to the converted image.</p>
  </section>
</main>
<script>{{SEALED_SCRIPT}}</script>
</body>
</html>
